# Local Airflow that mirrors the Railway deployment (same image, LocalExecutor).
#
#   cd airflow && docker compose up --build
#   UI → http://localhost:8080  (user: $AIRFLOW_ADMIN_USER / $AIRFLOW_ADMIN_PASSWORD)
#
# All secrets come from ../.env (see .env.example) — never inline them here.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    env_file: ../.env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      # Live-edit DAGs and pipeline code without rebuilding
      - ../dags:/opt/airflow/dags
      - ../src/data-pipeline:/opt/nyc/src/data-pipeline
      - nyc-data:/opt/nyc/data
      - nyc-models:/opt/nyc/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  airflow-pg:
  nyc-data:
  nyc-models:
